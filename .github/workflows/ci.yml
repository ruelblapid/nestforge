name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  migrations-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nestjs_user
          POSTGRES_PASSWORD: nestjs_password
          POSTGRES_DB: nestjs_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs_user -d nestjs_postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nestjs_user:nestjs_password@localhost:5432/nestjs_postgres
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      JWT_REFRESH_SECRET: ci-refresh-ci-refresh-ci-refresh-ci-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nestforge build
      - run: pnpm --filter nestforge-starter migration:run
      # Fails if entities drifted from the committed migrations.
      - run: pnpm --filter nestforge-starter exec typeorm migration:generate -d dist/infrastructure/data-source.js --check src/infrastructure/migrations/Check
      - run: pnpm --filter nestforge-starter test:e2e
