services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nestjs_user
      POSTGRES_PASSWORD: nestjs_password
      POSTGRES_DB: nestjs_postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestjs_user -d nestjs_postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the built image against this database (docker compose --profile app up --build).
  migrate:
    profiles: [app]
    build: &app-build
      context: ../..
      dockerfile: templates/starter/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql://nestjs_user:nestjs_password@postgres:5432/nestjs_postgres
      DATABASE_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (32+ chars)}
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/infrastructure/data-source.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: *app-build
    environment: *app-env
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
